<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ORBIT: catch the early signals, act onboard. Offline health companion for astronauts. Synthetic data, not a diagnostic tool." />
    <title>ORBIT</title>
    <!-- Apply the saved theme before first paint (see src/lib/theme.ts). -->
    <script>
      try { if (localStorage.getItem('orbit.theme') === 'light') document.documentElement.dataset.theme = 'light' } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
